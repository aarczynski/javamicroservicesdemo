apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool

---
# Restricts the Gateway's L2 announcement to the two nodes tainted
# role=platform:NoSchedule (platform-1/platform-2, renamed from
# worker-1/worker-2 2026-09-14) — see ip-address-pool.yaml for why this IP
# got its own pool, and CLAUDE.md's node/taint table for the platform vs
# generic-worker split.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: gateway-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - gateway-pool
  nodeSelectors:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - k8s-rpi-platform-1
            - k8s-rpi-platform-2
