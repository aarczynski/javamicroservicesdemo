apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - default-pool

---
# Restricts the Gateway's L2 announcement to the node tainted
# role=platform:NoSchedule (platform-1, renamed from worker-1 2026-09-14) —
# see ip-address-pool.yaml for why this IP got its own pool, and CLAUDE.md's
# node/taint table for the platform vs generic-worker split.
#
# platform-2 dropped from this list 2026-09-20: MetalLB's L2 mode is
# active-passive per IP, so platform-2 was never actually carrying Gateway
# traffic (measured near-idle, ~1.8% CPU, even at 1200rps) — a dedicated
# failover node wasn't earning its keep, so it was repurposed to worker-5
# instead (see inventory.ini). No failover for `.100` anymore; accepted
# trade-off, not an oversight.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: gateway-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - gateway-pool
  nodeSelectors:
    - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
            - k8s-rpi-platform-1
