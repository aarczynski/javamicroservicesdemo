# helm repo add metallb https://metallb.github.io/metallb
# helm upgrade --install metallb metallb/metallb -n metallb-system -f values-metallb.yaml --version 0.16.1
#
# Previously applied via ad-hoc `--set` flags on the CLI (see git history /
# handoff for the original 2026-08-26 command) — tracked here now so the
# speaker's tolerations aren't only reconstructable from shell history.

frrk8s:
  enabled: false # Omada doesn't speak BGP, L2 mode only.

# Pinned 2026-09-28: with no nodeSelector/toleration the controller drifted
# onto worker-4, sharing it with an app replica — every worker is reserved
# for exactly one app JVM (see RPS-SCALING.md #9).
controller:
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-platform-1
  tolerations:
    - key: role
      operator: Equal
      value: platform
      effect: NoSchedule

speaker:
  tolerations:
    - key: role
      operator: Equal
      value: database
      effect: NoSchedule
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule
    - key: role
      operator: Equal
      value: platform
      effect: NoSchedule
