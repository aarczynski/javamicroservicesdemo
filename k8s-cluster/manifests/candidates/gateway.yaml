# kubectl apply -f gateway.yaml
# Cilium Gateway API entry point for the system's public API. Requires:
# - Gateway API CRDs (standard channel v1.4.1) already installed cluster-wide.
# - Cilium's kubeProxyReplacement + gatewayAPI.enabled=true (see
#   k8s-cluster/manifests/cilium/values-cilium.yaml).
#
# spec.infrastructure.annotations propagates onto the LoadBalancer Service
# Cilium auto-creates for this Gateway — MetalLB (not Cilium's own LB-IPAM,
# which isn't configured in this cluster) picks it up from there, same as
# any other manually-written Service.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: api-gateway
  namespace: candidates
spec:
  gatewayClassName: cilium
  infrastructure:
    annotations:
      metallb.io/loadBalancerIPs: "192.168.10.100"
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-candidates
  namespace: candidates
spec:
  parentRefs:
    - name: api-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: app-candidates
          port: 8080
