# kubectl apply -f namespace.yaml -f postgres.yaml -f app.yaml
# app-candidates. Talks to Postgres in this namespace (already matches the
# image's baked-in docker/application.yml) and to app-job-offers cross-namespace.

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-candidates-config
  namespace: candidates
data:
  application.yml: |
    spring:
      datasource:
        url: jdbc:postgresql://postgres-candidates:5432/app-candidates-db
        username: postgres
        password: password
      cloud:
        openfeign:
          client:
            config:
              job-offers:
                url: http://app-job-offers.job-offers.svc.cluster.local:8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-candidates
  namespace: candidates
spec:
  # No `replicas` field here on purpose: the HorizontalPodAutoscaler
  # (hpa.yaml) owns this field once created. Leaving a hardcoded value here
  # would fight it — every `kubectl apply` (e.g. `make k8s-deploy`) would
  # reset replicas back to this number, undoing whatever the HPA had scaled
  # to until it next reconciles. `kubectl apply` never touches a field the
  # manifest doesn't mention, so omitting it entirely is the correct way to
  # hand ownership to the HPA. minReplicas there (2) is what actually governs
  # the floor.
  # Default RollingUpdate (maxSurge=25%) tries to briefly run a 3rd pod during
  # a rollout — with the hard anti-affinity below and exactly one node per
  # app replica, there's no valid node for that surge pod, and the rollout
  # deadlocks (found live 2026-09-20: a restart got stuck on
  # "0/12 nodes are available: 4 node(s) didn't match pod anti-affinity
  # rules" until an old pod was deleted by hand). maxSurge=0 keeps rollouts
  # within the fixed one-pod-per-node budget: terminate one old pod, then
  # start its replacement, never both variants of the same node's "slot" at
  # once.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: app-candidates
  template:
    metadata:
      labels:
        app: app-candidates
    spec:
      # ndots:5 (k8s default) makes glibc/JVM getaddrinfo() try up to 4 extra
      # search-domain-expanded queries (candidates.svc.cluster.local, ...,
      # lan) before the real, already-fully-qualified name — a single lost
      # UDP packet on any of those costs a full 5s resolver timeout. Our
      # cross-namespace FQDNs (app-job-offers.job-offers.svc.cluster.local,
      # otel-collector...observability.svc.cluster.local) have 4 dots, so
      # ndots:1 tries them as absolute first, skipping the search list.
      # Root-caused 2026-08-28 via JVM thread dump: Tomcat worker threads
      # serialized on InetAddress$NameServiceAddresses's per-host lock while
      # one thread sat in native lookupAllHostAddr for seconds.
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      # One pod per node, guaranteed — not left to the scheduler's default
      # spreading heuristics, which are soft preferences, not hard rules.
      # 2026-09-19/20: two app-candidates/app-job-offers replicas landing on
      # the same node (reducing generic workers from 4 to 3 for
      # observability-3) caused a measured ~10x CPU-throttling gap between
      # the shared-node pod and a dedicated one, plus a self-reinforcing
      # Gateway connection-imbalance under load — see
      # k8s-cluster/RPS-SCALING.md. With exactly one generic worker per app
      # replica again, this hard-requires that spread instead of hoping for
      # it after every restart/redeploy.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - app-candidates
                      - app-job-offers
              # podAntiAffinity defaults to the scheduled pod's OWN namespace
              # when this is omitted — app-job-offers lives in a different
              # namespace (job-offers), so without this the rule silently
              # only self-avoids (candidates vs candidates) and never sees
              # job-offers pods at all. Found live 2026-09-20: two pods still
              # landed on the same node despite this rule being present.
              namespaces:
                - candidates
                - job-offers
              topologyKey: kubernetes.io/hostname
      containers:
        - name: app-candidates
          image: 192.168.10.190:5000/app-candidates:aeb84de
          # sun.net.inetaddr.negative.ttl: JDK defaults to caching a FAILED DNS
          # lookup for 10s. A single transient packet loss (ndots:1 still hits
          # this occasionally, root-caused 2026-08-28) then poisons every
          # request for the next 10s with an immediate UnknownHostException
          # instead of each retrying independently — observed as a cascade of
          # ~26 sub-10ms error traces following one genuine resolution
          # failure. Set to 1s so a transient loss doesn't compound.
          command: ["java", "-Djava.net.preferIPv4Stack=true", "-Dsun.net.inetaddr.negative.ttl=1", "-javaagent:./opentelemetry-javaagent.jar", "-jar", "./app-candidates.jar"]
          ports:
            - containerPort: 8080
            - containerPort: 8081
          env:
            - name: OTEL_SERVICE_NAME
              value: app-candidates
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "1000"
            - name: OTEL_BSP_SCHEDULE_DELAY
              value: "1000"
            - name: OTEL_INSTRUMENTATION_SPRING_BOOT_ACTUATOR_AUTOCONFIGURE_ENABLED
              value: "true"
            # false, not true: the Micrometer bridge and the agent's native JVM
            # semconv instrumentation both export metrics under the same names
            # (e.g. jvm.memory.committed) with different types/sources, which
            # clashes and can corrupt the export - confirmed live 2026-09-20 as
            # the cause of jvm_cpu_recent_utilization_ratio getting stuck at a
            # flat 0 after its first real sample (worse right after a full
            # cluster restart - 4/5 app instances hit it that time). Known,
            # closed-as-not-planned upstream issue:
            # https://github.com/open-telemetry/opentelemetry-java-instrumentation/issues/11122
            # ("your best option is not to enable both of these instrumentations
            # at the same time"). Nothing here actually reads Micrometer-named
            # metrics (every dashboard panel queries the native semconv names),
            # so there's no downside to leaving it off.
            - name: OTEL_INSTRUMENTATION_MICROMETER_ENABLED
              value: "false"
            - name: OTEL_INSTRUMENTATION_COMMON_EXPERIMENTAL_CONTROLLER_TELEMETRY_ENABLED
              value: "true"
            # Logs now go through Alloy (reads stdout directly, see
            # k8s-cluster/manifests/alloy/values-alloy.yaml) instead of the
            # agent's own OTLP log export — traces/metrics OTLP unaffected.
            # Compose keeps the agent's OTLP log export (no Alloy there).
            - name: OTEL_LOGS_EXPORTER
              value: none
          volumeMounts:
            - name: config
              mountPath: /app/application.yml
              subPath: application.yml
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            # initialDelaySeconds 20 -> 60 on 2026-09-20: a freshly-scaled
            # pod gets its full traffic share the instant it passes
            # readiness (no LB slow-start available - see hpa.yaml's
            # comment), and a live 1500rps test caught the cold-JVM
            # consequence directly: p99 DB query latency on the new pod hit
            # 150-215ms vs a steady-state ~5ms baseline for a good ~60-90s,
            # which (same arrival rate, ~30-40x longer per query) blew the
            # Hikari pool's concurrency budget and produced real 500s. This
            # doesn't warm the JIT by itself (that still needs real traffic)
            # but gives Spring Boot's own startup work more idle time to
            # settle - independent of livenessProbe's own 40s
            # initialDelaySeconds below, no interaction between the two.
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: app-candidates-config

---
apiVersion: v1
kind: Service
metadata:
  name: app-candidates
  namespace: candidates
spec:
  type: ClusterIP
  selector:
    app: app-candidates
  ports:
    - port: 8080
      targetPort: 8080
