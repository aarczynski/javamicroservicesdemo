# kubectl apply -f namespace.yaml -f postgres.yaml
# Mirrors compose.yml's postgres-candidates service (image, credentials, db name).

apiVersion: v1
kind: Secret
metadata:
  name: postgres-candidates-credentials
  namespace: candidates
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-candidates-data
  namespace: candidates
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-candidates
  namespace: candidates
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-candidates
  template:
    metadata:
      labels:
        app: postgres-candidates
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-rpi-db-1
      tolerations:
        - key: role
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:18.3
          # max_connections 100 (image default) -> 150 on 2026-09-20, paired
          # with the Hikari pool bump in app-candidates/application.yml: at
          # 3 HPA-scaled replicas x maximum-pool-size 40 = 120 idle
          # connections alone, leaving only 30 headroom on the 100-connection
          # default before any burst even happened - a live 1500rps test hit
          # exactly this (see that file's comment for the full incident).
          # 150 restores ~30 connections of headroom above the 120 baseline.
          # Safe within the 2Gi memory limit below (checked: comfortably
          # under it even accounting for per-connection overhead).
          #
          # `args`, not `command`: the official image's ENTRYPOINT
          # (docker-entrypoint.sh) is what drops privileges from root to the
          # unprivileged postgres user before exec'ing the server - replacing
          # it via `command` skips that and postgres refuses to run as root
          # (found live 2026-09-20: CrashLoopBackOff, "root execution of the
          # PostgreSQL server is not permitted"). `args` appends to the
          # default entrypoint instead of replacing it.
          args: ["-c", "max_connections=150"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: app-candidates-db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-candidates-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-candidates-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
        # Native Postgres metrics (connections, cache hit ratio, locks,
        # transaction rate) - server-side, complementary to app-candidates'
        # client-side hikaricp_* pool metrics (see app.yaml for why those
        # need otel-metrics-filter.jar to coexist with a correct JVM CPU
        # metric). Sidecar, not a separate Deployment: shares the pod's
        # network namespace, so it reaches Postgres over localhost with no
        # extra Service. Scraped by the existing `kubernetes-service-
        # endpoints` Prometheus job via the Service annotations below - same
        # mechanism as kube-state-metrics/node-exporter, no otel-collector
        # change needed (unlike compose.yml, which has no annotation-based
        # scrape and routes this through otel-collector's prometheus
        # receiver instead).
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
          env:
            # Order matters: $(VAR) interpolation below only resolves
            # variables already defined earlier in this same list.
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-candidates-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-candidates-credentials
                  key: POSTGRES_PASSWORD
            - name: DATA_SOURCE_NAME
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@localhost:5432/app-candidates-db?sslmode=disable"
          ports:
            - containerPort: 9187
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-candidates-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-candidates
  namespace: candidates
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
spec:
  type: LoadBalancer
  selector:
    app: postgres-candidates
  ports:
    - port: 5432
      targetPort: 5432
