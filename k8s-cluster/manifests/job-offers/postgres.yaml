# kubectl apply -f namespace.yaml -f postgres.yaml
# Mirrors compose.yml's postgres-job-offers service (image, credentials, db name).

apiVersion: v1
kind: Secret
metadata:
  name: postgres-job-offers-credentials
  namespace: job-offers
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-job-offers-data
  namespace: job-offers
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-job-offers
  namespace: job-offers
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-job-offers
  template:
    metadata:
      labels:
        app: postgres-job-offers
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-rpi-db-2
      tolerations:
        - key: role
          operator: Equal
          value: database
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:18.3
          # Postgres sizes parallel query off nproc (4, the physical RPi5's
          # core count — cgroup CPU quotas don't change what the container
          # sees), not the k8s "cpu: 2" limit below. Tested 2026-09-11:
          # disabling this alone (single-query findCandidateMatches, no other
          # change) at 600rps — see README for the result before deciding
          # whether this stays.
          # shared_buffers: the 128MB default was far below the dataset (359MB at
          # 250k offers) — most reads became syscall copies from the OS page
          # cache, measured 2026-09-28 at >50% of active query samples waiting
          # on IO with zero disk reads. 1GB keeps the whole dataset in buffers
          # with ~1GB of the 2Gi limit left for backends.
          args: ["-c", "max_parallel_workers_per_gather=0", "-c", "shared_buffers=1GB"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: app-job-offers-db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-job-offers-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-job-offers-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "3"
              memory: 2Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-job-offers-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-job-offers
  namespace: job-offers
spec:
  type: LoadBalancer
  selector:
    app: postgres-job-offers
  ports:
    - port: 5432
      targetPort: 5432
