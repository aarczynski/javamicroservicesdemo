# kubectl apply -f namespace.yaml -f app.yaml
# load-background. Pure client (no exposed port) — sends sinusoidal ambient
# load at app-candidates via its in-cluster ClusterIP-equivalent DNS name.
# Pinned to k8s-rpi-observability-2 (moved from observability-1 on 2026-08-28
# to relieve CPU-limit overcommit there): keeps the ambient-load generator off
# the generic workers, colocated with the observability stack it feeds telemetry into.
# (Briefly moved to observability-1 on 2026-09-14 to test whether it was
# causing an unusually fast-blinking disk LED on observability-2 — LED
# behavior was unchanged after the move, so ruled out; moved back same day.
# /data is on a local-path PVC, which is node-pinned — the PVC must be
# deleted and recreated alongside any node move, see scripts/load-data.sh.)
#
# /data is a PVC, not baked into the image (found 2026-09-14: the image had a
# candidate SQL file baked in from its build date, completely disconnected
# from whatever's actually in Postgres today — ~96% 404s as a result).
# k8s-cluster/scripts/load-data.sh kubectl cp's a fresh file in after every
# data reload and restarts this Deployment; the PVC is what makes that
# survive the restart instead of reverting to nothing.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: load-background-data
  namespace: load-background
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-background
  namespace: load-background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-background
  template:
    metadata:
      labels:
        app: load-background
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-rpi-observability-2
      tolerations:
        - key: role
          operator: Equal
          value: observability
          effect: NoSchedule
      containers:
        - name: load-background
          image: 192.168.10.190:5000/load-background:5c455a4
          env:
            - name: DATA_FILE
              value: /data/01-candidates.sql
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: load-background-data
