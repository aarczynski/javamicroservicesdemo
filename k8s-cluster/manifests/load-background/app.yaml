# kubectl apply -f namespace.yaml -f app.yaml
# load-background. Pure client (no exposed port) — sends sinusoidal ambient
# load at app-candidates via its in-cluster ClusterIP-equivalent DNS name.
# Moved to k8s-rpi-platform-1 2026-09-20: observability-2 was carrying the
# highest CPU allocation of the three observability nodes (860m/21% request,
# 6200m/155% limit — see CLAUDE.md/handoff) after observability-3 relieved
# observability-1 but not -2. This pod is CPU/network-bound (not disk-heavy
# like Loki/Prometheus/Grafana/MinIO, which stayed put), and platform-1 has
# spare capacity (down to hosting just Gateway ingress/MetalLB/
# local-path-provisioner/registry since platform-2 -> worker-5 the same day).
# No storage-locality reason to keep it near the observability stack — it
# only reads/re-syncs a copy of the candidates SQL file.
# (Previously: observability-1 -> observability-2 2026-08-28 for CPU-limit
# overcommit; briefly back to -1 2026-09-14 to rule out a disk-LED theory,
# reverted same day; briefly repointed to -1 again in this file without ever
# being applied live — drifted from the actually-running -2, now moot.
# /data is on a local-path PVC, which is node-pinned — the PVC must be
# deleted and recreated alongside any node move, see scripts/load-data.sh.)
#
# /data is a PVC, not baked into the image (found 2026-09-14: the image had a
# candidate SQL file baked in from its build date, completely disconnected
# from whatever's actually in Postgres today — ~96% 404s as a result).
# k8s-cluster/scripts/load-data.sh kubectl cp's a fresh file in after every
# data reload and restarts this Deployment; the PVC is what makes that
# survive the restart instead of reverting to nothing.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: load-background-data
  namespace: load-background
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-background
  namespace: load-background
spec:
  replicas: 1
  selector:
    matchLabels:
      app: load-background
  template:
    metadata:
      labels:
        app: load-background
    spec:
      nodeSelector:
        # See the file-level comment above for why platform-1 (2026-09-20).
        kubernetes.io/hostname: k8s-rpi-platform-1
      tolerations:
        - key: role
          operator: Equal
          value: platform
          effect: NoSchedule
      containers:
        - name: load-background
          image: 192.168.10.190:5000/load-background:81949a9
          env:
            - name: DATA_FILE
              value: /data/01-candidates.sql
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: load-background-data
