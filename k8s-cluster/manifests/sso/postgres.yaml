# kubectl apply -k . (see kustomization.yaml)
# Hydra's own database. Mirrors compose.yml's postgres-hydra service. Pinned next to Hydra on sso-1.

apiVersion: v1
kind: Secret
metadata:
  name: postgres-hydra-credentials
  namespace: sso
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-hydra-data
  namespace: sso
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-hydra
  namespace: sso
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-hydra
  template:
    metadata:
      labels:
        app: postgres-hydra
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-rpi-sso-1
      tolerations:
        - key: role
          operator: Equal
          value: sso
          effect: NoSchedule
      containers:
        - name: postgres
          image: postgres:18.6
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: hydra-db
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-hydra-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-hydra-credentials
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-hydra-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-hydra
  namespace: sso
spec:
  type: ClusterIP
  selector:
    app: postgres-hydra
  ports:
    - port: 5432
      targetPort: 5432
