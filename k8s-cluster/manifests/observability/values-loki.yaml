# helm repo add grafana-community https://grafana-community.github.io/helm-charts
# helm install loki grafana-community/loki -n observability -f values-loki.yaml --version 18.11.3
#
# NOTE: grafana.github.io/helm-charts is frozen (migrated to grafana-community/helm-charts
# on 2026-01-30) — use grafana-community, not grafana, or you get stale/unmaintained charts.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2026-08-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  limits_config:
    retention_period: 168h # 7d, matches observability/loki/loki.yml
    max_query_lookback: 168h
  # Added 2026-09-20: "Logs Volume" dashboard panel (count_over_time over all services) took
  # 5-6s to load even on a quiet 30-min window — confirmed via query stats that it decompresses
  # every matching chunk on every load, no caching at all (resultsCache/chunksCache below are
  # chart-level extras that deploy a separate memcached Deployment, deliberately left off for a
  # single-node home lab). Embedded cache runs in-process instead, no new pod. Bounded by
  # max_size_mb so it can't repeat the 2026-09-03 OOM — see memory bump note below.
  query_range:
    cache_results: true
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 50
  chunk_store_config:
    chunk_cache_config:
      embedded_cache:
        enabled: true
        max_size_mb: 50

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  # Raised 512Mi->1Gi on 2026-09-03: a Gatling burst test (200rps, ~40min) OOMKilled this once
  # and left it unable to serve wide-time-range queries (e.g. the "Logs Volume" dashboard panel
  # timed out) even after recovering — the 512Mi budget was sized for ambient load (5-10rps),
  # not a burst. See values-tempo.yaml for the matching fix and full incident context.
  # cpu 500m->1500m on 2026-09-03 (second burst test, tempo-distributed this time): second-most
  # CPU-throttled pod in the cluster (throttled_seconds rate 0.49 at peak) while observability-1
  # stayed under 23% CPU busy — undersized limit, not a saturated node.
  # Raised 1Gi->1280Mi on 2026-09-20 alongside the embedded query/chunk cache above (2x50Mi bound)
  # to keep the same burst-test safety margin as before, not because idle usage grew.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1280Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-2
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

# SimpleScalable/Distributed components — unused in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# No object storage on this cluster — filesystem storage on the single node only.
minio:
  enabled: false

# Extras not needed for a home-lab single-node deployment.
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
