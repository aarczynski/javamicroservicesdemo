# helm repo add grafana-community https://grafana-community.github.io/helm-charts
# helm install grafana grafana-community/grafana -n observability -f values-grafana.yaml --version 12.11.2
#
# NOTE: grafana.github.io/helm-charts is frozen (migrated to grafana-community/helm-charts
# on 2026-01-30) — use grafana-community, not grafana, or you get stale/unmaintained charts.

image:
  tag: "13.1.4" # matches compose.yml

env:
  GF_AUTH_ANONYMOUS_ENABLED: "true"
  GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
  GF_AUTH_DISABLE_LOGIN_FORM: "true"

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  size: 1Gi

# LoadBalancer (via MetalLB) so Grafana is reachable at a stable IP from the
# LAN without kubectl port-forward. Pinned to .199 (last address in the
# MetalLB pool, right before the DHCP dynamic range) so it survives a
# Service delete/recreate and stays out of .100, reserved for the future
# ingress controller.
service:
  type: LoadBalancer
  annotations:
    metallb.io/loadBalancerIPs: "192.168.10.199"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

nodeSelector:
  kubernetes.io/hostname: k8s-rpi-observability-2
tolerations:
  - key: role
    operator: Equal
    value: observability
    effect: NoSchedule

# Dashboard JSON files are provisioned as separate ConfigMaps (see
# dashboards-configmap.yaml) labeled grafana_dashboard=1 — the sidecar below
# picks them up automatically, mirroring observability/grafana/provisioning/dashboards/.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"

# Same content as observability/grafana/provisioning/datasources/datasources.yml,
# with compose service names swapped for in-cluster Service DNS names.
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-server.observability.svc.cluster.local:80
        basicAuth: false
        isDefault: true
        editable: false
        jsonData:
          httpMethod: GET
          # Must match Prometheus's real global scrape_interval (15s, see
          # `values-prometheus.yaml`'s `server.global.scrape_interval` /
          # `curl .../api/v1/status/config`), not a guessed/rounded value.
          # Grafana uses this to compute $__rate_interval as
          # max($__interval + timeInterval, 4 * timeInterval) for every
          # rate()/irate() panel — a mismatch in EITHER direction breaks things:
          # too small (the old "1s" bug) collapses $__rate_interval below the
          # real scrape spacing, so rate() queries see 0 samples in-window
          # ("No data", fixed 2026-09-20 by setting this to "1m" — see
          # .claude/handoff-k8s-rpi-cluster.md); too large (that same "1m" fix,
          # once scrape_interval itself dropped to 15s) floors every rate()
          # panel's window at 4 minutes, smoothing away single-request HTTP
          # spikes and GC sawtooth patterns into a flat line. 15s keeps the
          # floor at a real 1 minute while still safely catching >=4 samples.
          # Change this value and `server.global.scrape_interval` together,
          # never one alone.
          timeInterval: "15s"
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        isDefault: false
        editable: false
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: trace_id
              matcherType: label
              name: trace_id
              url: $${__value.raw}
              urlDisplayLabel: View in Tempo
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        # tempo-query-frontend, not tempo — queries go through the query-frontend
        # now that Tempo runs as tempo-distributed (values-tempo-distributed.yaml).
        # Same port (3200) as the old single-binary Service — verified via
        # `helm template` against the real chart, not guessed.
        url: http://tempo-query-frontend.observability.svc.cluster.local:3200
        isDefault: false
        editable: false
        jsonData:
          httpMethod: GET
          serviceMap:
            datasourceUid: prometheus
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: '-10m'
            spanEndTimeShift: '10m'
            filterByTraceID: true
            filterBySpanID: true
            tags: [ { key: 'service.name', value: 'job' } ]
