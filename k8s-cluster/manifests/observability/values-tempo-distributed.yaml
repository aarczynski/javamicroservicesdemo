# helm repo add grafana-community https://grafana-community.github.io/helm-charts
# helm install tempo grafana-community/tempo-distributed -n observability -f values-tempo-distributed.yaml --version 3.5.1
#
# Replaces values-tempo.yaml (single-binary Tempo, 2.10.8 — permanently stuck below
# Compose's 3.0.3, see the removed pitfall-4 comments in that file's git history).
# tempo-distributed's chart is current with Tempo 3.x (appVersion 3.0.3, matches
# Compose) because it models the *microservices* architecture Tempo 3.0 actually
# shipped: distributor -> Kafka -> {live-store, block-builder} -> {backend-scheduler,
# backend-worker} -> {querier, query-frontend}. No more ingester/compactor — those
# don't exist in this chart version at all. See the "Differences from Docker Compose"
# section in the README for the full monolithic-vs-microservices explanation with a
# diagram, and k8s-cluster/manifests/kafka/ + k8s-cluster/manifests/minio/ for the two
# dependencies this pulls in that Compose's monolithic Tempo never needed.
#
# Verified (not assumed) before writing this file, all via `helm template` against
# the real chart (no cluster contact) plus the chart's own values.yaml comments:
#   - storage.trace.backend: local mounts an emptyDir PER POD, not a shared volume —
#     genuinely broken for multi-pod operation (querier can't see block-builder's
#     blocks). Real reason this needs MinIO, not a chart quirk to work around.
#   - traces.otlp.grpc.enabled defaults to FALSE — otel-collector's OTLP traces would
#     silently have nowhere to land without the override below.
#   - Kafka is not optional once liveStore/blockBuilder are enabled — chart comment:
#     "Required for Tempo 3.0 microservices mode. Distributors write spans to Kafka."
#   - global.goSettings auto-injects GOMEMLIMIT (goMemLimitFactor: 0.85) and GOGC (80)
#     per component from its own resources.limits.memory — chart default, left as-is.
#     Unlike the old single-binary chart, no manual GOMEMLIMIT/ballast tuning needed
#     here as long as every component below has an explicit memory limit.

traces:
  otlp:
    grpc:
      enabled: true

ingest:
  kafka:
    address: "tempo-kafka-kafka-bootstrap.observability.svc.cluster.local:9092"
    # 1 partition, matching the single-node Kafka cluster (k8s-cluster/manifests/kafka/)
    # — live-store/block-builder replicas below must equal this.
    auto_create_topic_default_partitions: 1

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: minio.observability.svc.cluster.local:9000
      access_key: minioadmin
      secret_key: minioadmin123
      insecure: true # MinIO over plain HTTP, internal-only traffic
      forcepathstyle: true # required for MinIO (no virtual-hosted-style bucket DNS)

# No memcached — Compose's single-binary Tempo has no cache config either; adding one
# here would be new behavior, not parity. Chart defaults to memcached.enabled: true
# with cache.caches wired to it, so both need to be turned off together.
memcached:
  enabled: false
cache:
  caches: []

backendScheduler:
  config:
    provider:
      compaction:
        compaction:
          block_retention: 168h # 7d, matches Compose's observability/tempo/tempo.yml
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-2
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

backendWorker:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-2
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

blockBuilder:
  replicas: 1 # must equal ingest.kafka.auto_create_topic_default_partitions
  # cpu 500m->1000m, memory 512Mi->1.5Gi->3Gi on 2026-09-03: a 200rps Gatling burst
  # OOMKilled this repeatedly (CrashLoopBackOff) — the flush-to-MinIO memory spike
  # outpaces the 15-30s cAdvisor scrape interval, so working-set metrics never showed
  # >150MiB even right before each kill. Both nodes had 77-88% idle CPU throughout, so
  # this was a too-tight default limit, not a physical capacity problem — same root
  # cause as the old single-binary Tempo OOM (needed 2Gi), just isolated to one
  # component now. Raising to 1.5Gi still crash-looped: every failed restart left the
  # `block-builder` Kafka consumer group's offset uncommitted, so the backlog (verified
  # via `kafka-consumer-groups.sh --describe`: 14205 messages of lag) compounded across
  # attempts instead of shrinking — needs enough memory to consume the whole backlog in
  # one pass to break the spiral, not just steady-state throughput. 3Gi is generous
  # given the node has 5.6GiB free at 28% memory allocated; revisit down once caught up
  # and stable if it proves excessive for steady state.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 3072Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-2
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

liveStore:
  replicas: 1 # must equal ingest.kafka.auto_create_topic_default_partitions
  # cpu 500m->1500m on 2026-09-03: top CPU-throttled pod in the cluster during a 200rps
  # burst (throttled_seconds rate 0.63 at peak) while both observability nodes stayed
  # under 23% CPU busy — the limit was undersized relative to available headroom, not a
  # sign of a saturated node.
  # memory 768Mi->1.5Gi same day, found immediately after raising cpu above: local storage
  # is an emptyDir wiped on every pod restart, so live-store falls back to replaying the
  # Kafka lookback window (up to the topic's 1h retention) on startup — this catch-up
  # ingests far more data per second than steady-state traffic ever does, OOMKilled
  # (exit 137) within seconds of restart even though observed steady-state peak was only
  # 523Mi. The steady-state number understated the real requirement.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-2
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

# distributor/querier/query-frontend grouped on observability-1 (the busier node —
# these three are comparatively light, mostly proxy/coordinate rather than hold data)
# — see values-strimzi-operator.yaml for the placement rationale.
distributor:
  # cpu 200m->1000m on 2026-09-03: throttled under the same 200rps burst that OOMKilled
  # blockBuilder and throttled liveStore (see comments there) — same fix, same reasoning.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-1
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

querier:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-1
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule

queryFrontend:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  nodeSelector:
    kubernetes.io/hostname: k8s-rpi-observability-1
  tolerations:
    - key: role
      operator: Equal
      value: observability
      effect: NoSchedule
