# helm repo add grafana-community https://grafana-community.github.io/helm-charts
# helm install tempo grafana-community/tempo -n observability -f values-tempo.yaml --version 2.3.0
#
# NOTE: grafana.github.io/helm-charts is frozen (migrated to grafana-community/helm-charts
# on 2026-01-30) — use grafana-community, not grafana, or you get stale/unmaintained charts.

replicas: 1

tempo:
  # Tested 2026-08-26: overriding to 3.0.3 (compose.yml's pin) breaks —
  # Tempo 3.x's app.Config dropped the top-level compactor/ingester fields
  # this chart generates ("field compactor not found in type app.Config").
  # Real schema rewrite, not just new optional sections — chart would need
  # to be rewritten upstream to support 3.x. Staying on chart default (2.10.8).
  retention: 168h # 7d, matches observability/tempo/tempo.yml
  # Chart default (1024) pre-allocates a GC ballast equal to the whole 1Gi
  # memory limit below, leaving no headroom for actual heap — guaranteed
  # OOMKilled under any real traffic (found 2026-08-27 after repeated OOM
  # despite raising the limit). Lowered well below the limit instead.
  memBallastSizeMbs: 128
  # Ballast alone wasn't enough — verified via Prometheus (container_memory_working_set_bytes)
  # that usage still climbs to ~1000-1007Mi (right at the 1024Mi limit) before OOMKilled, on a
  # repeating ~45-60min sawtooth. Root cause: Go's GC triggers off GOGC (heap-doubling), not the
  # cgroup limit, so without GOMEMLIMIT it can overshoot the container limit before a GC cycle
  # fires. GOMEMLIMIT gives the runtime a soft target so GC kicks in proactively.
  # Raised 1Gi->2Gi / GOMEMLIMIT 800MiB->1600MiB on 2026-09-03 after a Gatling burst test
  # (200rps, ~40min) drove working set to the 1024Mi ceiling and triggered a sustained
  # CrashLoopBackOff (8+ OOMKilled in the test window, still looping at ambient load
  # afterwards) — the 1Gi budget was sized for ambient load (5-10rps), not a burst. Both
  # observability nodes have ample headroom (7.75Gi total, ~1.5-3Gi committed) for this.
  extraEnv:
    - name: GOMEMLIMIT
      value: "1600MiB"
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 2Gi
  # storage.trace.backend defaults to "local" already — matches compose.yml

persistence:
  enabled: true
  storageClassName: local-path
  size: 10Gi

nodeSelector:
  # Moved from k8s-rpi-observability-1 on 2026-08-28 to relieve CPU-limit
  # overcommit there (was 125%) — fresh PVC on observability-2, prior 7d
  # trace history not migrated (acceptable for a home-lab).
  kubernetes.io/hostname: k8s-rpi-observability-2
tolerations:
  - key: role
    operator: Equal
    value: observability
    effect: NoSchedule
