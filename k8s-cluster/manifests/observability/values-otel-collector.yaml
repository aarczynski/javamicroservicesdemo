# helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
# helm install otel-collector open-telemetry/opentelemetry-collector -n observability -f values-otel-collector.yaml --version 0.171.0
#
# Endpoints point at in-cluster Service DNS names (verified via `helm template` against
# the actually-rendered prometheus/tempo-distributed Services in this same directory):
#   prometheus-server.observability.svc.cluster.local:80 (chart Service port — not 9090)
#   tempo-distributor.observability.svc.cluster.local:4317
#
# No Loki endpoint here (unlike observability/otel-collector/otel-collector.yml for
# Compose) — see the "logs" pipeline note below, logs bypass this collector in k8s.

mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.159.0"

# alternateConfig fully replaces the chart's default config (no merge with chart
# presets) — same pipeline as observability/otel-collector/otel-collector.yml,
# with compose service names swapped for in-cluster Service DNS names.
alternateConfig:
  extensions:
    # explicit 0.0.0.0 bind — default is localhost-only, unreachable for the
    # kubelet's liveness/readiness probes, which connect via the pod IP.
    health_check:
      endpoint: 0.0.0.0:13133

  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

  connectors:
    span_metrics:
      namespace: db
      metrics_flush_interval: 1s
      histogram:
        explicit:
          buckets: ["5ms", "10ms", "25ms", "50ms", "75ms", "100ms", "250ms", "500ms", "750ms", "1s", "2500ms", "5s", "7500ms", "10s"]
      dimensions:
        - name: db.system
        - name: db.system.name
        - name: db.operation.name
      exemplars:
        enabled: true

  processors:
    batch:
      send_batch_max_size: 1000
      send_batch_size: 100
      timeout: 5s
    batch/metrics:
      send_batch_max_size: 1000
      send_batch_size: 100
      timeout: 5s
    filter/db_spans:
      error_mode: ignore
      traces:
        span:
          - 'attributes["db.system"] == nil and attributes["db.system.name"] == nil'
    # Tail sampling for the traces actually stored in Tempo (NOT applied to the
    # traces/db_spans pipeline below, which feeds span_metrics — that stays on
    # 100% of spans so DB duration histograms/dashboards keep full accuracy).
    # Added 2026-09-20: sustained 1200-1500rps load tests were pushing enough
    # trace volume through Kafka/Tempo's write path to crash observability-1's
    # kubelet, twice — see k8s-cluster/RPS-SCALING.md. Multiple top-level
    # policies are OR'd by this processor: a trace is kept if ANY policy says
    # so, so this is "100% of 4xx/5xx + 100% of traces slower than 500ms +
    # independently ~1% of everything else" (the ~1% is not additional on top
    # of the other two — errors/slow traces already always match their own
    # policy, sample-rest just also independently rolls the dice on every
    # trace including those).
    # sample-slow added 2026-09-20 on request: `latency` looks at total trace
    # duration (max span end - min span start across the whole trace), not
    # any single span, so a fast root handler with one slow downstream call
    # still gets caught.
    tail_sampling:
      decision_wait: 5s
      policies:
        - name: sample-errors
          type: numeric_attribute
          numeric_attribute:
            key: http.response.status_code
            min_value: 400
            max_value: 599
        - name: sample-slow
          type: latency
          latency:
            threshold_ms: 500
        - name: sample-rest
          type: probabilistic
          probabilistic:
            sampling_percentage: 1

  exporters:
    prometheusremotewrite:
      endpoint: "http://prometheus-server.observability.svc.cluster.local:80/api/v1/write"

    otlp_grpc/tempo:
      # tempo-distributor, not tempo — Tempo runs as tempo-distributed now, this
      # points at the distributor's OTLP receiver (see values-tempo-distributed.yaml).
      # Verified via `helm template` against the real chart, not guessed.
      endpoint: "tempo-distributor.observability.svc.cluster.local:4317"
      tls:
        insecure: true

  service:
    extensions: [health_check]
    pipelines:
      metrics:
        receivers: [otlp, span_metrics]
        processors: [batch/metrics]
        exporters: [prometheusremotewrite]
      traces:
        receivers: [otlp]
        processors: [tail_sampling, batch]
        exporters: [otlp_grpc/tempo]
      traces/db_spans:
        receivers: [otlp]
        processors: [filter/db_spans]
        exporters: [span_metrics]
      # No logs pipeline here (unlike observability/otel-collector/otel-collector.yml
      # for Compose): k8s apps set OTEL_LOGS_EXPORTER=none and ship logs via the
      # Alloy DaemonSet instead (k8s-cluster/manifests/alloy/values-alloy.yaml) —
      # a collector OOM here no longer takes logging down with it.

# Raised 512Mi->1Gi on 2026-09-03: a Gatling burst test (200rps, ~40min) OOMKilled this
# repeatedly (6+ times in the test window) — the 512Mi budget was sized for ambient load
# (5-10rps from load-background), not a burst. See values-tempo.yaml for the matching fix
# and full incident context.
# Raised again 1Gi->2Gi, 500m->1000m on 2026-09-20 for tail_sampling above: it now
# buffers every trace in memory for decision_wait (5s) before deciding whether to
# keep it, instead of streaming straight through — at 1200-1500rps that's thousands
# of buffered traces at any given moment, not the near-stateless pass-through this
# was originally sized for.
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

# Moved to observability-3 on 2026-09-20: observability-1 was carrying Kafka + all of
# Tempo's write path + this collector (8 services on one RPi5), and its kubelet
# stopped responding under sustained 1200-1500rps load tests, repeatedly — see
# .claude/handoff-k8s-rpi-cluster.md. This collector just forwards to
# tempo-distributor (already on observability-2) over the network either way, so
# there's no locality reason to keep it next to Kafka.
nodeSelector:
  kubernetes.io/hostname: k8s-rpi-observability-3
tolerations:
  - key: role
    operator: Equal
    value: observability
    effect: NoSchedule
