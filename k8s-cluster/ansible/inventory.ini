# ansible_host = IP address (DHCP reservation in Omada, keyed by the board's eth0 MAC)
# inventory hostname (e.g. k8s-rpi-worker-1) = target hostname set by the playbook
# naming convention: k8s-rpi-* (distinguishes these from other RPis on the same Omada network)
#
# Two kinds of boards: Rev 1.0 with BCM2712 C1 and Rev 1.1 with the cost-reduced
# D0, which writes memory 2-3x slower beyond L2 (see k8s-cluster/RPS-SCALING.md,
# "Known issue"). The D0 boards run the roles that barely use CPU under load
# (master, observability, sso) and one app-candidates replica (worker-6); the 8
# C1 boards run the rest of the request path (Gateway, Postgres, the apps).
# bcm2712_stepping becomes the node label bcm2712-stepping (cluster-init.yml).

# Control plane. D0.
[k8s_master]
# 88:a2:9e:42:82:d4, D0
k8s-rpi-master ansible_host=192.168.10.1 bcm2712_stepping=d0

# Generic app workers (app-candidates/app-job-offers, no taint). C1, except
# worker-6 (D0, added 2026-10-31): app-job-offers is kept off D0 by node affinity
# on the bcm2712-stepping label, so it holds an app-candidates replica.
[k8s_workers]
# 2c:cf:67:34:5f:1c, C1
k8s-rpi-worker-1 ansible_host=192.168.10.10 bcm2712_stepping=c1
# d8:3a:dd:f5:ce:13, C1
k8s-rpi-worker-2 ansible_host=192.168.10.11 bcm2712_stepping=c1
# 2c:cf:67:30:68:1a, C1
k8s-rpi-worker-3 ansible_host=192.168.10.12 bcm2712_stepping=c1
# d8:3a:dd:f5:b9:54, C1
k8s-rpi-worker-4 ansible_host=192.168.10.13 bcm2712_stepping=c1
# d8:3a:dd:f5:cd:1a, C1
k8s-rpi-worker-5 ansible_host=192.168.10.14 bcm2712_stepping=c1
# 98:fe:54:45:3a:73, D0 (was sso-2)
k8s-rpi-worker-6 ansible_host=192.168.10.15 bcm2712_stepping=d0

# Gateway ingress, MetalLB controller, local-path-provisioner, image registry,
# NTP. Taint role=platform:NoSchedule. A single node, no Gateway failover (MetalLB
# L2 is active-passive per IP, see l2-advertisement.yaml). C1 — every request
# passes through the Gateway.
[k8s_platform]
# d8:3a:dd:f5:cc:a5, C1
k8s-rpi-platform-1 ansible_host=192.168.10.2 bcm2712_stepping=c1

# Postgres instances. Taint role=database:NoSchedule. All C1.
[k8s_database]
# d8:3a:dd:f5:cc:33, C1
k8s-rpi-db-1 ansible_host=192.168.10.50 bcm2712_stepping=c1
# d8:3a:dd:f5:cd:ef, C1
k8s-rpi-db-2 ansible_host=192.168.10.51 bcm2712_stepping=c1

# Observability stack. Taint role=observability:NoSchedule. All D0.
[k8s_observability]
# 88:a2:9e:65:4e:c9, D0
k8s-rpi-observability-1 ansible_host=192.168.10.90 bcm2712_stepping=d0
# 88:a2:9e:2f:b1:2c, D0
k8s-rpi-observability-2 ansible_host=192.168.10.91 bcm2712_stepping=d0
# 88:a2:9e:9c:f3:0c, D0
k8s-rpi-observability-3 ansible_host=192.168.10.92 bcm2712_stepping=d0

# SSO (Ory Hydra + its Postgres). Taint role=sso:NoSchedule. D0.
[k8s_sso]
# 98:fe:54:45:45:01, D0
k8s-rpi-sso-1 ansible_host=192.168.10.60 bcm2712_stepping=d0

[k8s_all:children]
k8s_master
k8s_database
k8s_observability
k8s_platform
k8s_sso
k8s_workers

[k8s_all:vars]
ansible_user=aarczynski
