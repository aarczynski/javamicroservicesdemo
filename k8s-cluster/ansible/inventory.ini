# Add each RPi as it gets provisioned.
# ansible_host = IP address (DHCP reservation in Omada)
# inventory hostname (e.g. k8s-rpi-worker-1) = target hostname set by the playbook
# naming convention: k8s-rpi-* (distinguishes these from other RPis on the same Omada network)

[k8s_master]
k8s-rpi-master ansible_host=192.168.10.1

# Generic app workers only (app-candidates/app-job-offers, no taint).
# Renumbered 1-4 2026-09-14 (previously worker-3..6) once worker-1/worker-2
# were renamed platform-1/platform-2 below. IPs also shifted down to .10-.13
# (previously .12-.15) to close the gap left by platform-1/2 moving to .2/.3
# — user reassigns these in Omada too, same as platform-1/2.
[k8s_workers]
k8s-rpi-worker-1 ansible_host=192.168.10.10
k8s-rpi-worker-2 ansible_host=192.168.10.11
k8s-rpi-worker-3 ansible_host=192.168.10.12

# Cluster-level infra + SSO (Gateway ingress, MetalLB controller,
# local-path-provisioner, future Keycloak). Taint role=platform:NoSchedule —
# see CLAUDE.md/README node taint tables. Renamed from worker-1/worker-2 and
# moved to .2/.3 (closer to master) 2026-09-14.
[k8s_platform]
k8s-rpi-platform-1 ansible_host=192.168.10.2
k8s-rpi-platform-2 ansible_host=192.168.10.3

[k8s_database]
k8s-rpi-db-1 ansible_host=192.168.10.50
k8s-rpi-db-2 ansible_host=192.168.10.51
k8s-rpi-db-3 ansible_host=192.168.10.52

[k8s_observability]
k8s-rpi-observability-1 ansible_host=192.168.10.90
k8s-rpi-observability-2 ansible_host=192.168.10.91
k8s-rpi-observability-3 ansible_host=192.168.10.92


[k8s_all:children]
k8s_master
k8s_database
k8s_observability
k8s_platform
k8s_workers

[k8s_all:vars]
ansible_user=aarczynski
