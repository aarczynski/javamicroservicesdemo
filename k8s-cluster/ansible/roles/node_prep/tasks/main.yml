---
- name: Set hostname to match inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Map new hostname in /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Check whether machine-id was already regenerated
  ansible.builtin.stat:
    path: /root/.ansible_machine_id_done
  register: machine_id_marker

- name: Regenerate machine-id (unique per RPi, matters when cloning SD/NVMe images)
  when: not machine_id_marker.stat.exists
  notify: reboot node
  block:
    - ansible.builtin.file:
        path: /etc/machine-id
        state: absent
    - ansible.builtin.file:
        path: /var/lib/dbus/machine-id
        state: absent
    - ansible.builtin.command: systemd-machine-id-setup
    - ansible.builtin.file:
        src: /etc/machine-id
        dest: /var/lib/dbus/machine-id
        state: link
    - ansible.builtin.file:
        path: /root/.ansible_machine_id_done
        state: touch

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts['swaptotal_mb'] > 0
  changed_when: true

- name: Remove swap entries from /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: '\sswap\s'
    state: absent

- name: Read current /boot/firmware/cmdline.txt
  ansible.builtin.slurp:
    src: /boot/firmware/cmdline.txt
  register: cmdline_raw

- name: "Safety net: ensure cgroup memory controller is enabled in cmdline"
  ansible.builtin.replace:
    path: /boot/firmware/cmdline.txt
    regexp: '^(.*)$'
    replace: '\1 cgroup_enable=memory cgroup_memory=1'
  when: "'cgroup_memory=1' not in (cmdline_raw.content | b64decode)"
  notify: reboot node

- name: Load required kernel modules
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Persist kernel modules across reboot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Configure sysctl params for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    mode: '0644'
  notify: reload sysctl

- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

- name: Ensure /etc/containerd directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Generate default containerd config
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup in containerd (matches kubelet's cgroup driver)
  ansible.builtin.lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^(\s*)SystemdCgroup = false'
    line: '\1SystemdCgroup = true'
    backrefs: true
  notify: restart containerd

- name: Point every containerd config_path at a single certs.d directory
  # `containerd config default` on containerd 2.2.1 (this cluster's version)
  # ships config_path as a COLON-JOINED list — '/etc/containerd/certs.d:/etc/docker/certs.d'
  # under [plugins.'io.containerd.cri.v1.images'.registry], and '' (empty)
  # under [plugins.'io.containerd.transfer.v1.local'] — both single-quoted,
  # never the '""' this task originally looked for (a leftover assumption
  # from older containerd's config format, which never matched here).
  # Found live 2026-09-19: kubelet's actual CRI PullImage calls silently
  # ignore hosts.toml under a colon-joined config_path — `containerd config
  # dump` reports it as set correctly, debug logs show no attempt to read
  # certs.d at all, and every pull falls through to a bare HTTPS request
  # ("http: server gave HTTP response to HTTPS client") even though `ctr
  # images pull --hosts-dir /etc/containerd/certs.d` (explicit override)
  # works fine with the exact same hosts.toml. A single bare path fixes it —
  # confirmed against a real CRI-driven pull (not just `ctr`, which doesn't
  # consult config.toml the same way and gave a false negative during
  # diagnosis). Do NOT add `[registry.mirrors]`/`[registry.configs]` inline
  # sections alongside config_path either — containerd 2.x refuses to load
  # the whole CRI images plugin when both are set ("`mirrors` cannot be set
  # when `config_path` is provided"), which took the entire CRI service down
  # cluster-wide during this same diagnosis.
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "^(\\s*)config_path = '.*'$"
    replace: "\\1config_path = '/etc/containerd/certs.d'"
  notify: restart containerd

- name: Ensure containerd's registry config directory exists for the local image registry
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ local_registry_host }}"
    state: directory
    mode: '0755'

- name: Trust the local image registry over plain HTTP (self-hosted, LAN-only, no TLS)
  ansible.builtin.copy:
    dest: "/etc/containerd/certs.d/{{ local_registry_host }}/hosts.toml"
    content: |
      server = "http://{{ local_registry_host }}"

      [host."http://{{ local_registry_host }}"]
        capabilities = ["pull", "resolve", "push"]
        skip_verify = true
    mode: '0644'
  notify: restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Add Kubernetes APT repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/"
    suites: /
    signed_by: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    state: present

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold Kubernetes packages at their installed version (apt hold)
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

- name: Enable kubelet (only starts serving once kubeadm init/join runs)
  ansible.builtin.systemd:
    name: kubelet
    enabled: true

- name: Gather service facts (to detect systemd-timesyncd vs chrony)
  ansible.builtin.service_facts:

# {{ ntp_server_host }} runs as a local NTP server for the rest of the fleet.
# Tightening every node's poll interval against the public pool alone (an
# earlier, insufficient fix) only shrank the window between corrections; it
# didn't fix each correction being noisy, since a single WAN round trip to
# ntp.ubuntu.com carries 13-48ms of jitter on its own (measured live
# 2026-09-20) - a fresh trace still showed an ~18ms gap after that fix alone.
# Chrony is used here, not timesyncd, which is client-only and cannot serve
# NTP to other hosts.
- name: Install chrony on the local NTP server node
  when: inventory_hostname == ntp_server_host
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true

- name: Configure the local NTP server to serve the cluster subnet
  # `port 123` must be explicit - confirmed live 2026-09-20 that this chrony
  # build never binds the NTP server socket at all without it (chronyd only
  # listened on the 127.0.0.1:323 command port until this was added), despite
  # 123 supposedly being chronyd's documented default.
  when: inventory_hostname == ntp_server_host
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/server.conf
    content: |
      allow 192.168.10.0/24
      local stratum 10
      port 123
    mode: '0644'
  notify: restart chrony

- name: Enable and start chrony on the local NTP server
  # No explicit "disable systemd-timesyncd" step needed - installing the
  # chrony package already removes that unit as a side effect of the
  # package conflict between the two (confirmed live 2026-09-20: the unit
  # was gone immediately after `apt install chrony`, before this task ran).
  when: inventory_hostname == ntp_server_host
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started

# Every other node points at the local NTP server above instead of the
# public pool. Default systemd-timesyncd config (empty [Time] section) also
# backs off PollIntervalMaxSec to its 2048s (34 min) ceiling once the clock
# looks stable - confirmed live 2026-09-20 via `timedatectl show-timesync`
# (PollIntervalUSec=34min 8s). Between polls each RPi5's onboard oscillator
# free-runs and drifts independently, and different nodes hit that ceiling at
# different times - part of the "clock skew breaks the trace waterfall"
# symptom this fixes alongside the local server above (see RPS-SCALING.md /
# handoff for the distributed tracing investigation that found this).
- name: Point systemd-timesyncd at the local NTP server and tighten its poll interval
  when:
    - inventory_hostname != ntp_server_host
    - "'systemd-timesyncd.service' in ansible_facts.services"
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf
    content: |
      [Time]
      NTP={{ ntp_server_ip }}
      PollIntervalMinSec=16
      PollIntervalMaxSec=64
    mode: '0644'
  notify: restart systemd-timesyncd

# The fleet isn't uniform - found live that worker-2 runs chrony instead of
# systemd-timesyncd (unclear provisioning history). Its own adaptive polling
# already disciplines the clock well against the public pool (confirmed via
# `chronyc tracking`: ~0.017ms offset), so it doesn't need the poll-interval
# fix above, but it should still prefer the low-jitter local server over the
# public pool like every other node.
- name: Prefer the local NTP server on nodes running chrony instead of systemd-timesyncd
  when:
    - inventory_hostname != ntp_server_host
    - "'chrony.service' in ansible_facts.services"
  ansible.builtin.copy:
    dest: /etc/chrony/conf.d/prefer-local-server.conf
    content: |
      server {{ ntp_server_ip }} iburst prefer
    mode: '0644'
  notify: restart chrony
