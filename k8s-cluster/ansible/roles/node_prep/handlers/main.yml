---
- name: reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: restart containerd
  ansible.builtin.systemd:
    name: containerd
    state: restarted

- name: reboot node
  ansible.builtin.reboot:
    reboot_timeout: 300

- name: restart systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd
    state: restarted

- name: restart chrony
  ansible.builtin.systemd:
    name: chrony
    state: restarted
