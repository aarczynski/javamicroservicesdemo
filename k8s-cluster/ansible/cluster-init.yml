---
# Bootstraps the Kubernetes control plane and joins every other node.
# Requires node_prep (playbook.yml) to have already run — this only handles
# kubeadm init/join/taint, not OS-level prerequisites.
#
# Idempotent: safe to re-run after adding a single new node to inventory.ini,
# or after a partial failure — nodes that already joined are skipped.
#
# Pod CIDR must match Cilium's ipam.operator.clusterPoolIPv4PodCIDRList in
# k8s-cluster/manifests/cilium/values-cilium.yaml.

- name: Initialize the control plane on the master
  hosts: k8s_master
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"
  tasks:
    - name: Check whether this node already initialized the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Run kubeadm init
      ansible.builtin.command: >
        kubeadm init
        --control-plane-endpoint={{ ansible_host }}
        --pod-network-cidr={{ pod_network_cidr }}
      when: not admin_conf.stat.exists
      register: kubeadm_init_result

    - name: Create .kube directory for the ansible_user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Copy admin.conf into the ansible_user's kube config
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Fetch admin kubeconfig to the control machine
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../kubeconfig"
        flat: true

    - name: Generate a fresh join command
      ansible.builtin.command: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Share the join command with the other plays in this run
      ansible.builtin.set_fact:
        kubeadm_join_command: "{{ join_command_raw.stdout }}"

- name: Join the rest of the cluster
  hosts: k8s_database:k8s_observability:k8s_platform:k8s_workers
  become: true
  tasks:
    - name: Check whether this node already joined the cluster
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Run kubeadm join
      ansible.builtin.command: "{{ hostvars[groups['k8s_master'][0]].kubeadm_join_command }}"
      when: not kubelet_conf.stat.exists

- name: Taint nodes by role
  hosts: k8s_master
  # No become: kubectl doesn't need root, and we're already connected as
  # ansible_user, who owns ~/.kube/config (copied there in the init play).
  vars:
    kubeconfig_path: "/home/{{ ansible_user }}/.kube/config"
  tasks:
    - name: Taint database nodes (role=database:NoSchedule)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        taint node {{ item }} role=database:NoSchedule --overwrite
      loop: "{{ groups['k8s_database'] }}"
      changed_when: true

    - name: Taint observability nodes (role=observability:NoSchedule)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        taint node {{ item }} role=observability:NoSchedule --overwrite
      loop: "{{ groups['k8s_observability'] }}"
      changed_when: true

    - name: Taint platform nodes (role=platform:NoSchedule)
      ansible.builtin.command: >
        kubectl --kubeconfig={{ kubeconfig_path }}
        taint node {{ item }} role=platform:NoSchedule --overwrite
      loop: "{{ groups['k8s_platform'] }}"
      changed_when: true
