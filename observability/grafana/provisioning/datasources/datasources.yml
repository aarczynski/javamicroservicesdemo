apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    editable: false
    jsonData:
      httpMethod: GET
      timeInterval: "1s"
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: trace_id
          matcherType: label
          name: trace_id
          url: $${__value.raw}
          urlDisplayLabel: View in Tempo
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: prometheus
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-10m'
        spanEndTimeShift: '10m'
        # Custom query, not filterByTraceID/filterBySpanID: those append a line filter (|="<id>"),
        # but trace_id lives in structured metadata (OTLP logs don't carry it in the line body),
        # and Loki's label is service_name - there is no `job` label.
        customQuery: true
        query: '{$${__tags}} | trace_id="$${__trace.traceId}"'
        tags: [ { key: 'service.name', value: 'service_name' } ]

