extensions:
  health_check:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
  # Native Postgres metrics (postgres_exporter, one per DB instance) - pulled
  # here rather than adding a scrape config to Prometheus itself, keeping
  # Prometheus config-free and everything flowing through this one collector
  # (matches how app metrics arrive: push via the otlp receiver above, not a
  # Prometheus-side scrape).
  prometheus/postgres_exporters:
    config:
      scrape_configs:
        - job_name: postgres-candidates
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter-candidates:9187"]
        - job_name: postgres-job-offers
          scrape_interval: 15s
          static_configs:
            - targets: ["postgres-exporter-job-offers:9187"]

processors:
  batch:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 5s
  batch/metrics:
    send_batch_max_size: 1000
    send_batch_size: 100
    timeout: 5s

exporters:
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

  otlp_grpc/tempo:
    endpoint: "http://tempo:4317"
    tls:
      insecure: true

  otlp_http/loki:
    endpoint: "http://loki:3100/otlp"

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp, prometheus/postgres_exporters]
      processors: [batch/metrics]
      exporters: [prometheusremotewrite]
    # Traces arrive already sampled by the apps (otel-metrics-filter's
    # LocalTailSamplingSpanExporter) - everything that reaches this pipeline is kept.
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http/loki]
