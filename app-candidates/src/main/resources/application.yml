spring:
  datasource:
    hikari:
      # 30 -> 40 on 2026-09-20: sized for a fixed 2 replicas (60 idle conns,
      # comfortable under Postgres's default max_connections=100). The
      # app-candidates HPA (hpa.yaml) can now run 3 replicas, and a live
      # 1500rps test caught it: a freshly-scaled pod immediately got its
      # full traffic share and produced real "HikariPool-1 - Connection is
      # not available" 500s (waiting=114 against a 30-connection pool) - not
      # a Tomcat/network issue, genuine DB-connection-pool exhaustion under
      # burst concurrency. 40 x 3 = 120, within the matching
      # max_connections=150 bump in postgres.yaml (30 connections of
      # headroom for tooling/migrations/a future replica).
      connection-timeout: 3000
      maximum-pool-size: 40
      minimum-idle: 40
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: db/migration/postgres
logging:
  pattern:
    # trace_id/span_id come from MDC, populated automatically by the OTel
    # javaagent's logback-mdc instrumentation for any active span. Printed
    # here (rather than relying only on direct OTLP log export) because k8s
    # logs go through Alloy reading raw stdout, not the agent's OTLP path
    # (see k8s-cluster/manifests/alloy/values-alloy.yaml) — Alloy regexes
    # these back out of the text to keep the Loki -> Tempo trace link alive.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] trace_id=%X{trace_id} span_id=%X{span_id} %logger{36} - %msg%n"
management:
  server:
    # Separate connector/thread pool from the business port (8080). Without
    # this, liveness/readiness probes compete with request-handling threads
    # for the same Tomcat pool — under load, a saturated pool makes the probe
    # time out too, and kubelet kills a pod that's merely slow, not dead.
    port: 8081
  observations:
    annotations:
      enabled: true
  endpoints:
    web:
      exposure:
        include: [ 'health', 'prometheus' ]
