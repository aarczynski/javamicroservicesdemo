spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/h2
  cloud:
    openfeign:
      client:
        config:
          job-offers:
            url: http://localhost:9999
      oauth2:
        enabled: true
        client-registration-id: job-offers
  security:
    oauth2:
      client:
        registration:
          job-offers:
            provider: hydra
            client-id: app-candidates
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: job-offers.search
        provider:
          hydra:
            token-uri: http://localhost:9998/oauth2/token
candidates:
  security:
    sso-timeout: 2s
