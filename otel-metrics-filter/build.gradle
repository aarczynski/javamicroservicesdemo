plugins {
    id 'java'
    id 'groovy'
}

group = 'pl.luna-software.demo.microservices'

java {
    sourceCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

// compileOnly, not implementation: this jar is loaded by the OTel javaagent via
// -Dotel.javaagent.extensions/OTEL_JAVAAGENT_EXTENSIONS, which already provides these classes
// on its own (shaded) classpath at runtime - bundling them here would duplicate/shadow them.
dependencies {
    compileOnly "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:$otelSdkVer"
    compileOnly "io.opentelemetry:opentelemetry-sdk-metrics:$otelSdkVer"
    compileOnly "io.opentelemetry:opentelemetry-sdk-trace:$otelSdkVer"
    compileOnly "io.opentelemetry:opentelemetry-sdk-common:$otelSdkVer"

    testImplementation "io.opentelemetry:opentelemetry-sdk-trace:$otelSdkVer"
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:$otelSdkVer"
    testImplementation 'org.spockframework:spock-core:2.4-groovy-5.0'
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}
